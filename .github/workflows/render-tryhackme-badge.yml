name: Render TryHackMe HTML Badge

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  render:
    name: Render TryHackMe Badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Render TryHackMe badge
        run: |
          node << 'EOF'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 400,
                height: 150
              },
              deviceScaleFactor: 1
            });

            const url =
              "https://tryhackme.com/p/" +
              "schnehowebking" +
              "?_=" +
              Date.now();

            console.log("Opening:", url);

            const response = await page.goto(url, {
              waitUntil: "domcontentloaded",
              timeout: 60000
            });

            console.log("HTTP status:", response?.status());
            console.log("Page title:", await page.title());

            await page.waitForTimeout(5000);

            // Try to find the badge.
            const selectors = [
              "#thm-badge",
              "[id*='badge']",
              "img[src*='badge']",
              "img[alt*='TryHackMe']",
              "svg"
            ];

            let badge = null;

            for (const selector of selectors) {
              const element = page.locator(selector).first();

              if (await element.count()) {
                console.log("Found:", selector);
                badge = element;
                break;
              }
            }

            if (!badge) {
              console.log("Could not find badge element.");

              await page.screenshot({
                path: "debug-page.png",
                fullPage: true
              });

              throw new Error(
                "TryHackMe badge element was not found."
              );
            }

            await badge.screenshot({
              path: "tryhackme-badge.png"
            });

            console.log(
              "TryHackMe badge screenshot created successfully."
            );

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Verify generated badge
        run: |
          echo "Generated files:"
          ls -lah

          if [ ! -f tryhackme-badge.png ]; then
            echo "ERROR: tryhackme-badge.png was not created."
            exit 1
          fi

          file tryhackme-badge.png

      - name: Commit badge if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tryhackme-badge.png

          if git diff --cached --quiet; then
            echo "Badge has not changed."
          else
            git commit -m "Update TryHackMe badge"
            git push
          fi
