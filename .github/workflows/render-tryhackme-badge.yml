name: Render TryHackMe HTML Badge

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render TryHackMe Badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Render TryHackMe badge
        run: |
          node << 'EOF'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 400,
                height: 150
              },
              deviceScaleFactor: 1
            });

            const url =
              "https://tryhackme.com/api/v2/badges/public-profile" +
              "?userPublicId=914563" +
              "&_=" + Date.now();

            console.log("Opening:", url);

            const response = await page.goto(url, {
              waitUntil: "domcontentloaded",
              timeout: 60000
            });

            console.log("HTTP status:", response?.status());

            /*
             * TryHackMe renders #thm-badge dynamically.
             * Wait until it actually exists.
             */
            await page.waitForSelector("#thm-badge", {
              state: "visible",
              timeout: 30000
            });

            console.log("Found #thm-badge");

            const badge = page.locator("#thm-badge");

            /*
             * Make sure the badge has finished rendering.
             */
            await page.waitForTimeout(1000);

            const box = await badge.boundingBox();

            console.log("Badge bounding box:", box);

            if (!box) {
              throw new Error("Could not determine badge dimensions.");
            }

            /*
             * Capture ONLY the TryHackMe badge.
             */
            await badge.screenshot({
              path: "tryhackme-badge.png"
            });

            console.log(
              "Successfully created tryhackme-badge.png"
            );

            await browser.close();
          })().catch(async (error) => {
            console.error("Badge rendering failed:");
            console.error(error);

            process.exit(1);
          });
          EOF

      - name: Verify badge image
        run: |
          echo "Checking generated badge..."

          if [ ! -f tryhackme-badge.png ]; then
            echo "ERROR: tryhackme-badge.png does not exist."
            exit 1
          fi

          ls -lh tryhackme-badge.png
          file tryhackme-badge.png

      - name: Commit updated badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tryhackme-badge.png

          if git diff --cached --quiet; then
            echo "Badge has not changed."
          else
            git commit -m "Update TryHackMe badge"
            git push
          fi
