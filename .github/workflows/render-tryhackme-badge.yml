name: Render TryHackMe HTML Badge

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    # Every 15 minutes
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  render:
    name: Render TryHackMe Badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Render TryHackMe badge
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 340,
                height: 100
              },
              deviceScaleFactor: 1
            });

            const url =
              'https://tryhackme.com/api/v2/badges/public-profile' +
              '?userPublicId=914563' +
              '&_=' + Date.now();

            console.log('Opening:', url);

            const response = await page.goto(url, {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            console.log('HTTP status:', response?.status());

            await page.waitForSelector('#thm-badge', {
              timeout: 30000
            });

            const badge = page.locator('#thm-badge');

            await badge.screenshot({
              path: 'tryhackme-badge.png'
            });

            console.log('Badge screenshot created.');

            await browser.close();
          })().catch((error) => {
            console.error('ERROR:', error);
            process.exit(1);
          });
          EOF

      - name: Verify badge
        run: |
          test -f tryhackme-badge.png
          ls -lh tryhackme-badge.png
          file tryhackme-badge.png

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tryhackme-badge.png

          if git diff --cached --quiet; then
            echo "Badge has not changed."
          else
            git commit -m "Update TryHackMe badge"
            git push
          fi
